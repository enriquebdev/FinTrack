<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
    <script src="https://unpkg.com/lucide@latest"></script>
<body>

    <aside class="sidebar">

        <div class="logo">
            <h1>FinTrack</h1>
        </div>

        <nav class="menu">

            <a href="#" class="active">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a href="#">
                <i data-lucide="wallet"></i>
                <span>Transações</span>
            </a>

            <a href="#">
                <i data-lucide="tags"></i>
                <span>Categorias</span>
            </a>

            <a href="#">
                <i data-lucide="chart-column"></i>
                <span>Relatórios</span>
            </a>

            <a href="#">
                <i data-lucide="target"></i>
                <span>Metas</span>
            </a>

            <a href="#">
                <i data-lucide="settings"></i>
                <span>Configurações</span>
            </a>

        </nav>

        <div class="bottom">

            <a href="#">
                <i data-lucide="log-out"></i>
                <span>Sair</span>
            </a>

        </div>

    </aside>

    <div class="content">

        <header>

            <section class="pesquisa">
                Buscar
            </section>

            <section id="icones">
            </section>

        </header>

        <main class="dashboard">

            <section class="card saldo">
                <h3>Saldo</h3>
                <p>R$ 0,00</p>
            </section>

            <section class="card receitas">
                <h3>Receitas</h3>
                <p>R$ 0,00</p>
            </section>

            <section class="card despesas">
                <h3>Despesas</h3>
                <p>R$ 0,00</p>
            </section>

            <section class="card meta">
                <h3>Meta</h3>
                <p>R$ 0,00</p>
            </section>

            <section class="card grafico-linha"></section>

            <section class="card grafico-pizza"></section>

            <section class="card grafico-barra"></section>

            <section class="card categorias"></section>

            <section class="card transacoes"></section>

        </main>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>
